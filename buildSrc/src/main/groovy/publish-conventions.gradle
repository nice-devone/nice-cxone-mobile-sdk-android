plugins {
    id "maven-publish"
}

publishing {
    repositories {
        maven {
            name = "github"
            url "https://maven.pkg.github.com/nice-devone/nice-cxone-mobile-sdk-android"
            credentials {
                username = project.findProperty("github.user") ?: System.getenv("GPR_USERNAME")
                password = project.findProperty("github.key") ?: System.getenv("GPR_TOKEN")
            }
        }
    }
}

// Helper method to configure POM metadata for all publications
// This can be called from both Groovy and Kotlin build scripts
ext.configurePomMetadata = { pom ->
    pom.name.set(project.findProperty("POM_NAME") ?: rootProject.findProperty("POM_NAME") ?: "CXone Chat")
    pom.description.set(project.findProperty("POM_DESCRIPTION") ?: rootProject.findProperty("POM_DESCRIPTION") ?: "Android SDK implementation for CXone Chat")
    pom.inceptionYear.set(project.findProperty("POM_INCEPTION_YEAR") ?: rootProject.findProperty("POM_INCEPTION_YEAR") ?: "2021")
    pom.url.set(project.findProperty("POM_URL") ?: rootProject.findProperty("POM_URL") ?: "https://github.com/nice-devone/nice-cxone-mobile-sdk-android/")

    pom.licenses {
        license {
            name.set(project.findProperty("POM_LICENSE_NAME") ?: rootProject.findProperty("POM_LICENSE_NAME") ?: "NICE LICENSE")
            url.set(project.findProperty("POM_LICENSE_URL") ?: rootProject.findProperty("POM_LICENSE_URL") ?: "https://www.nice.com/company/legal")
            distribution.set(project.findProperty("POM_LICENSE_DIST") ?: rootProject.findProperty("POM_LICENSE_DIST") ?: "repo")
        }
    }

    pom.developers {
        developer {
            id.set(project.findProperty("POM_DEVELOPER_ID") ?: rootProject.findProperty("POM_DEVELOPER_ID") ?: "nice-devone")
            name.set(project.findProperty("POM_DEVELOPER_NAME") ?: rootProject.findProperty("POM_DEVELOPER_NAME") ?: "NICE")
            url.set(project.findProperty("POM_DEVELOPER_URL") ?: rootProject.findProperty("POM_DEVELOPER_URL") ?: "https://github.com/nice-devone/")
        }
    }

    pom.scm {
        url.set(project.findProperty("POM_SCM_URL") ?: rootProject.findProperty("POM_SCM_URL") ?: "https://github.com/nice-devone/nice-cxone-mobile-sdk-android/")
        connection.set(project.findProperty("POM_SCM_CONNECTION") ?: rootProject.findProperty("POM_SCM_CONNECTION") ?: "scm:git:git://github.com/nice-devone/nice-cxone-mobile-sdk-android/.git")
        developerConnection.set(project.findProperty("POM_SCM_DEV_CONNECTION") ?: rootProject.findProperty("POM_SCM_DEV_CONNECTION") ?: "scm:git:ssh://git@github.com/nice-devone/nice-cxone-mobile-sdk-android/.git")
    }
}

static String getGitCurrentBranch() {
    def branch = ""
    def proc = "git rev-parse --abbrev-ref HEAD".execute()
    proc.in.eachLine { line -> branch = line }
    proc.err.eachLine { line -> println line }
    proc.waitFor()
    return branch
}

/**
 * Combines base version with branch.
 * If the branch starts with "sdk/" then prefix "sdk/" is removed otherwise the default branch name "main" is used.
 * Then branch name is escaped by replacing chars '/', '_'  with '-'.
 * Final string is created by combining `${versionBase}
 * @param versionBase base which will be used for combining with branch.
 * @return
 */
static String branchVersion(String versionBase) {
    if (versionBase == null) {
        return null
    }
    final def featureBranch = "feature/"
    final def defaultBranch = "main"
    String branch = getGitCurrentBranch()
    if (!branch.startsWith(featureBranch)) {
        branch = defaultBranch
    }
    return versionBase + "-" + branch.replaceAll("[/_]", "-") + "-SNAPSHOT"
}

/**
 * This task will set project version to use version + branch name
 */
tasks.register("publishToMavenLocalAsBranchVersion") {
    doFirst {
        project.version = branchVersion(project.findProperty("VERSION_NAME") ?: project.version)
        println("Publishing local version:" + project.version)
    }

    configure {
        group = "Publishing"
        description = "Publishes artifact to MavenLocal using current version + branch as artifact name"
    }
}

/**
 * Final part of setup for publishToMavenLocalAsBranchVersion - orders tasks
 * First setup is performed and then publishing itself.
 */
tasks.getByName("publishToMavenLocalAsBranchVersion") finalizedBy tasks.getByName("publishToMavenLocal")
