name: Deploy tag

on:
  push:
    # on any tag created from git
    tags:
      - "*"
  workflow_dispatch:
  # show a button to manually trigger this workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Append Version
        run: |
          Name=${{ github.ref_name }}
          Name=`echo ${Name}| tr \/_ -`
          echo "VERSION_NAME=$Name" >> gradle.properties
          echo "RELEASE_SIGNING_ENABLED=false" >> gradle.properties

      - name: Run build
        run: >
          ./gradlew
          publishAllPublicationsToGithubRepository
          -Pandroid.experimental.settings.executionProfile=ci
          --no-daemon
          --no-parallel
        env:
          GPR_USERNAME: ${{ github.repository_owner }}
          GPR_TOKEN: ${{ github.token }}

#      - name: Release
#        run: ./gradlew closeAndReleaseRepository
