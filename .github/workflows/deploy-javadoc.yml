name: Deploy JavaDoc

on:
  push:
    branches:
      - "main"
    paths:
      - '**/src/main/**.kt'
      - '**/README.md'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/deploy-javadoc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin" # aka adopt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run build
        run: ./gradlew dokkaGenerate -Pandroid.experimental.settings.executionProfile=ci
        env:
          GPR_USERNAME: ${{ github.repository_owner }}
          GPR_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: javadoc-html
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Prepare Repository
        run: |
          rm -rf *
          rm -rf .github .idea .gitignore .chglog
          git checkout --orphan static-feature/pages

      - uses: actions/download-artifact@v8
        with:
          name: javadoc-html

      - name: Add & Commit
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          push: origin static-feature/pages --force
          message: 'Documentation'
