name: Deploy JavaDoc

on:
  push:
    branches:
      - "main"
    paths:
      - '**/src/main/**.kt'
      - '**README.md'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/deploy-javadoc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run build
        run: ./gradlew dokkaGenerate -Pandroid.experimental.settings.executionProfile=ci
        env:
          GPR_USERNAME: ${{ github.repository_owner }}
          GPR_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: javadoc-html
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Prepare Repository
        run: |
          rm -rf *
          rm -rf .github .idea .gitignore .chglog
          git checkout --orphan static-feature/pages

      - uses: actions/download-artifact@v8
        with:
          name: javadoc-html

      - name: Add & Commit
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          push: origin static-feature/pages --force
          message: 'Documentation'
